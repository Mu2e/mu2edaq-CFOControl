schema: mega-review/1
package: mu2edaq-CFOControl
tier: A
group: operations
repo:
  url: git@github.com:Mu2e/mu2edaq-CFOControl.git
  exists: true
  issues_enabled: true
doc_dir: docs
summary: >
  Python command-line client for the otsdaq MacroMaker UDP remote-control
  interface that lists front-ends and their FE macros and runs one macro, such
  as CFO Write, on a CFO or DTC front-end
languages: [python, bash]
loc: 944

runtime:
  executables:
    - name: CFOControl.py
      kind: cli
      man_page: man/man1/CFOControl.py.1
    - name: start-mu2edaq-cfocontrol.sh
      kind: script
      man_page: man/man1/start-mu2edaq-cfocontrol.sh.1
    - name: stop-mu2edaq-cfocontrol.sh
      kind: script
      man_page: man/man1/stop-mu2edaq-cfocontrol.sh.1
    - name: ots_mm_udp_interface
      kind: library
      man_page: man/man3/ots_mm_udp_interface.3
  services: []
  ports:
    - {port: 5000, proto: udp, role: macromaker-remote-control-destination, source: "config.yaml:12"}
    - {port: 5000, proto: udp, role: macromaker-remote-control-destination-start-script, source: "start-mu2edaq-cfocontrol.sh:16"}
  config_files: [config.yaml]
  env_vars: [CRS_PORT_MACROMAKER]

interactions:
  depends_on:
    - package: otsdaq-mu2e
      via: udp
      direction: out
      evidence: "ots_mm_udp_interface.py:409"
  depended_on_by: []
  external: [otsdaq-utilities-macromaker-supervisor]


notes:
  write_safety_verdict: >
    No write protection of its own: no confirmation prompt, dry-run, allow-list,
    read-back or local audit record (CFOControl.py:249-297), and the MacroMaker
    UDP path runs every request as NO-USER with "allUsers: 255"
    (otsdaq-utilities MacroMakerSupervisor.cc:560-561), so the server adds none.
    The one register-write macro, CFO Write (address, writeData), cannot be
    issued correctly: build_input_string joins pairs with a raw ';' inside the
    ';'-split datagram, so writeData lands in the output-names field (CFO-001,
    reproduced against a mock). A plain-text "Error: ..." reply, e.g. FE
    supervisor not configured, exits 0 (CFO-002). The docstring example
    targets the CFO Control Register reset bit 0x9100 bit 0 (CFO-003).
  truncation_verdict: >
    Yes. _receive_all ends a reply at the first inter-datagram gap longer than
    timeouts.next_packet (0.2 s) with no length, sequence or end-of-document
    check (ots_mm_udp_interface.py:186-200). The truncated text is returned as
    if complete. For RunFrontendMacro the only signal is a WARNING when the
    output count is short, and the exit status is 0 (reproduced: 0.5 s gap,
    1 of 2 outputs printed, exit 0). For GetFrontendMacroInfo a cut inside an
    FEMacros element silently drops that front-end and all later ones (CFO-004).
  brief_correction: >
    The UDP :5000 endpoint is served by the otsdaq-utilities MacroMaker
    supervisor (RemoteControlWorkLoop, enabled only when OTS_MACROMAKER_UDP_IP
    and OTS_MACROMAKER_UDP_PORT are both set), not by otsdaq-mu2e's
    CFOFrontEndInterface, which only registers the FE macros that the
    MacroMaker forwards to over SOAP. The depends_on entry on otsdaq-mu2e is
    therefore indirect, through the MacroMaker.
  venv_exclusion: >
    Superproject testing/common.sh:55 (pkg_needs_venv) returns 1 for
    mu2edaq-CFOControl, so the suite harness creates no venv for it; the start
    script falls back to the system python3, which must provide PyYAML.
  discovery_meta: >
    Not applicable (CONTRACT 9.5): the package neither announces nor queries
    mu2edaq-discovery.
  man_layout: >
    New pages, already in man/manN/ layout; no git mv; no stale path references.
  loc: >
    944 = CFOControl.py 377 + ots_mm_udp_interface.py 502 + config.yaml 32 +
    start/stop scripts 33 (wc -l of all tracked source).
  resumed_draft: >
    ARCHITECTURE.md, INTERFACES.md and ISSUES-PENDING.md were drafted by a
    terminated agent; every cited server line was re-read and the three
    protocol findings re-run against an independent mock before commit.
